[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; Частота процессора
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L

; Файловая система для загрузки веб-ресурсов из data/
board_build.filesystem = littlefs

; Настройки загрузки
upload_speed = 921600
monitor_speed = 115200

; Настройки разделов для OTA
board_build.partitions = default.csv

; Библиотеки
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit ADS1X15@^2.2.3  # 16-битный АЦП ADS1115
    bblanchon/ArduinoJson@^7.0.4
    https://github.com/ESP32Async/ESPAsyncWebServer.git  # Поддерживаемый форк ESPAsyncWebServer
    me-no-dev/AsyncTCP@^1.1.1
    OneWire@^2.3.7
    milesburton/DallasTemperature@^3.11.0
    knolleary/PubSubClient@^2.8

; Флаги сборки
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -fpermissive  ; Разрешить несовместимость const qualifier в ESPAsyncWebServer
    ; Увеличиваем размер стека для AsyncTCP (по умолчанию 4096, увеличиваем до 16384 для ESP32-C3)
    -D CONFIG_ASYNC_TCP_STACK_SIZE=16384
    ; Автоматически включаем SerialCompat.h во все единицы компиляции (включая библиотеки)
    ; Защита от конфликта с ядром уже есть в SerialCompat.h (#ifndef Serial)
    -include include/SerialCompat.h

; Настройки монитора
monitor_filters =
    esp32_exception_decoder
    time
