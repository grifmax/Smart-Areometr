<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мультисенсорный режим - Smart Areometr</title>
    <script>
        // Применяем тему ДО загрузки CSS, чтобы избежать мигания
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme !== 'light') {
                document.documentElement.setAttribute('data-theme', savedTheme);
            }
        })();
    </script>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>

<body>
    <div class="container">
        <!-- Навигация -->
        <nav class="navbar">
            <div class="nav-brand">
                <span class="icon">🍺</span>
                <span class="brand-text">Smart Areometr</span>
            </div>
            <div class="nav-menu" id="navMenu">
                <a href="/" class="nav-link">Главная</a>
                <a href="/calibration.html" class="nav-link">Калибровка</a>
                <a href="/fractions.html" class="nav-link">Фракции</a>
                <a href="/receivers.html" class="nav-link">Приемники</a>
                <a href="/distillation.html" class="nav-link">Сессии</a>
                <a href="/sensors.html" class="nav-link active">Датчики</a>
                <a href="/mqtt.html" class="nav-link">MQTT</a>
                <a href="/settings.html" class="nav-link">Настройки</a>
                <a href="/logs.html" class="nav-link">Логи</a>
            </div>
            <div class="nav-controls">
                <button class="hamburger-btn" id="hamburgerBtn" aria-label="Меню">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </nav>

        <!-- Основной контент -->
        <main class="main-content">
            <!-- Статус датчиков -->
            <div class="card">
                <div class="card-header">
                    <h2>📊 Статус датчиков</h2>
                </div>
                <div class="card-body">
                    <div id="sensorsStatus" class="sensors-grid">
                        <!-- Будет заполнено через JavaScript -->
                    </div>
                </div>
            </div>

            <!-- Графики всех датчиков -->
            <div class="card">
                <div class="card-header">
                    <h2>📈 Графики показаний</h2>
                </div>
                <div class="card-body">
                    <canvas id="sensorsChart"></canvas>
                </div>
            </div>

            <!-- Сравнение датчиков -->
            <div class="card">
                <div class="card-header">
                    <h2>⚖️ Сравнение датчиков</h2>
                </div>
                <div class="card-body">
                    <div id="sensorsComparison">
                        <!-- Будет заполнено через JavaScript -->
                    </div>
                </div>
            </div>

            <!-- Управление датчиками -->
            <div class="card">
                <div class="card-header">
                    <h2>⚙️ Управление датчиками</h2>
                </div>
                <div class="card-body">
                    <div id="sensorsControl">
                        <!-- Будет заполнено через JavaScript -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/theme.js"></script>
    <script src="/js/sensors.js"></script>
</body>

</html>
