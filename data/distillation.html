<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сессии перегонки - Smart Areometr</title>
    <script>
        // Применяем тему ДО загрузки CSS, чтобы избежать мигания
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme !== 'light') {
                document.documentElement.setAttribute('data-theme', savedTheme);
            }
        })();
    </script>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="container">
        <!-- Навигация -->
        <nav class="navbar">
            <div class="nav-brand">
                <span class="icon">🍺</span>
                <span class="brand-text">Smart Areometr</span>
            </div>
            <div class="nav-menu" id="navMenu">
                <a href="/" class="nav-link">Главная</a>
                <a href="/calibration.html" class="nav-link">Калибровка</a>
                <a href="/fractions.html" class="nav-link">Фракции</a>
                <a href="/receivers.html" class="nav-link">Приемники</a>
                <a href="/distillation.html" class="nav-link active">Сессии</a>
                <a href="/mqtt.html" class="nav-link">MQTT</a>
                <a href="/settings.html" class="nav-link">Настройки</a>
                <a href="/logs.html" class="nav-link">Логи</a>
            </div>
            <div class="nav-controls">
                <button class="hamburger-btn" id="hamburgerBtn" aria-label="Меню">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </nav>

        <!-- Основной контент -->
        <main class="main-content">
            <!-- Управление сессией -->
            <div class="card">
                <div class="card-header">
                    <h2>Управление сессией</h2>
                </div>
                <div class="card-body">
                    <div class="session-controls">
                        <div class="session-status" id="sessionStatus">
                            <div class="status-indicator" id="statusIndicator"></div>
                            <div class="status-text">
                                <strong id="statusText">Не начата</strong>
                                <span id="statusDetails"></span>
                            </div>
                        </div>

                        <div class="session-form" id="sessionForm">
                            <div class="form-group">
                                <label for="sessionName">Название сессии:</label>
                                <input type="text" id="sessionName" placeholder="Например: Перегонка #1" value="Сессия">
                            </div>
                            <div class="form-group">
                                <label for="mashVolume">Объем браги (л):</label>
                                <input type="number" id="mashVolume" step="0.1" min="0" placeholder="0" value="0">
                            </div>
                            <div class="form-group">
                                <label for="expectedYield">Ожидаемый выход (л):</label>
                                <input type="number" id="expectedYield" step="0.1" min="0" placeholder="0" value="0">
                            </div>
                            <button class="btn-primary" onclick="startSession()" id="startBtn">Начать сессию</button>
                        </div>

                        <div class="session-actions" id="sessionActions" style="display: none;">
                            <button class="btn-secondary" onclick="pauseSession()" id="pauseBtn">Пауза</button>
                            <button class="btn-danger" onclick="stopSession()" id="stopBtn">Остановить</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Статистика сессии -->
            <div class="card">
                <div class="card-header">
                    <h2>Статистика сессии</h2>
                </div>
                <div class="card-body">
                    <div class="stats-grid" id="sessionStats">
                        <div class="stat-box">
                            <div class="stat-label">Длительность</div>
                            <div class="stat-value" id="duration">00:00:00</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Точек данных</div>
                            <div class="stat-value" id="dataPoints">0</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Прогресс</div>
                            <div class="stat-value" id="progress">0%</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Собрано</div>
                            <div class="stat-value" id="collected">0 л</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Экспорт данных -->
            <div class="card">
                <div class="card-header">
                    <h2>Экспорт данных</h2>
                </div>
                <div class="card-body">
                    <div class="export-actions">
                        <button class="btn-primary" onclick="exportJSON()" id="exportJSONBtn" disabled>
                            <span>📥</span> Экспорт JSON
                        </button>
                        <button class="btn-primary" onclick="exportCSV()" id="exportCSVBtn" disabled>
                            <span>📊</span> Экспорт CSV
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/theme.js"></script>
    <script src="/js/distillation.js"></script>
</body>

</html>
